[project]
name = "sales-order-integration"
version = "3.0.0"
description = "Receives NetSuite sales orders, prices them with approved campaign rules and stores them (FastAPI + MongoDB)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymongo>=4.10",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.modules.settings" = ["assets/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
